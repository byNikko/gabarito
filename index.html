<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imprimir</title>
<style>
  /* Remove as margens e centraliza a imagem na tela */
  body {
    margin: 0;
    padding: 0;
    background-color: #FFFFFF;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  
  /* Garante que a imagem caiba na folha na hora de imprimir */
  img {
    max-width: 100%;
    height: auto;
    display: block;
  }
</style>
</head>
<body>

  <!-- COLOQUE O LINK DA SUA IMAGEM AQUI (NO LUGAR DO SUA_IMAGEM.png) -->
  <img src="Hanging-guide-sea-A4_Prancheta 1.png" alt="Imagem para impressão">

  <script>
    // Esse é o truque: avisa o navegador para abrir a impressão assim que a imagem carregar!
    window.onload = function() {
      setTimeout(function() {
        window.print();
      }, 500); // Um pequeno atraso de meio segundo só para garantir que a imagem carregou na tela
    };
  </script>

</body>
</html>
